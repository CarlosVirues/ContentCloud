<script>

    row.className = 'item-row';
    row.innerHTML = `<div><strong>${it.item}</strong><br><small>${it.description}</small></div>
                     <input type='number' min='0' step='1' value='0' data-idx='${idx}'>`;
    container.appendChild(row);
  });

  container.querySelectorAll('input').forEach(el => el.addEventListener('input', () => {
    let totalCredits = 0;
    container.querySelectorAll('input').forEach(i => {
      const q = Number(i.value) || 0;
      const it = items[Number(i.dataset.idx)];
      totalCredits += q * Number(it.credits_per_piece || 0);
    });
    document.getElementById('cc-totalCredits').textContent = Number(totalCredits.toFixed(2));
    document.getElementById('cc-totalUSD').textContent = '$' + Number(totalCredits * usdPerCredit).toFixed(2);
  }));
})();
</script>

</body>
</html>
